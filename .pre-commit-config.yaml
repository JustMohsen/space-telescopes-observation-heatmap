repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (sort imports)
        entry: uv run isort
        language: system
        types: [python]
      - id: black
        name: black (code formatter)
        entry: uv run black
        language: system
        types: [python]
      - id: mypy
        name: mypy (static type checker)
        entry: uv run mypy src app.py scripts tests
        language: system
        types: [python]
        pass_filenames: false
