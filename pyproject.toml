[project]
name = "telescope-heatmap"
version = "0.1.0"
description = "Interactive 3D & 2D spherical heatmaps of space telescope observations (Hubble, JWST, and more)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.1.0",
    "astroquery>=0.4.7",
    "healpy>=1.17.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pyarrow>=17.0.0",
    "pyvo>=1.5.0",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.3",
    "pre-commit>=4.0.1",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telescope_heatmap"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["telescope_heatmap"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
